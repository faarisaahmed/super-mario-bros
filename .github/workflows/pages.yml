# Build the browser version with pygbag and publish it to GitHub Pages.
#
# tools/build_web.sh is the same script used locally, so what CI publishes is
# what you get from `./tools/build_web.sh` on your machine.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; queued runs supersede rather than race.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pygbag
        run: pip install pygbag==0.9.2 pygame==2.6.1

      - name: Check the exported policy is in sync with mario_ai.py
        run: python3 -c "from mario_ai import Policy; p = Policy.load(); print('policy loads,', len(p.layers), 'layers')"

      # The browser build's AI mode is the one path nothing else executes:
      # main.py calls asyncio.run() at import time, so it cannot be imported
      # and poked at, and a stale call signature would ship as a blank page
      # rather than a failed build. This runs the real loop headlessly.
      - name: Run AI mode headlessly
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          MARIO_SELFTEST: "900"
        run: python3 main.py

      - name: Build
        run: ./tools/build_web.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
